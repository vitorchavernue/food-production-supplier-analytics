[project]
name = "food-production-supplier-analytics"
version = "1.0.0"
description = "Poultry processing analytics: Oracle ERP -> Apache Hop -> PostgreSQL data warehouse -> Qlik Sense"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# SVG markup of the diagrams
"scripts/build_architecture.py" = ["E501"]

[tool.sqlfluff.core]
max_line_length = 0
